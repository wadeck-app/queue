name: CI / Publish

env:
    GITHUB_NPM_REGISTRY_PATH: //npm.pkg.github.com/

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'

            - name: Configure GitHub npm registry
              run: |
                  echo "@wadeck-app:registry=https:${GITHUB_NPM_REGISTRY_PATH}" >> ~/.npmrc
                  echo "${GITHUB_NPM_REGISTRY_PATH}:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dependencies
              run: npm install --prefer-offline

            - name: Build TypeScript
              run: npm run build

            - name: Run tests
              run: npm test

    publish:
        needs: build-and-test
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Configure GitHub npm registry (read -- for npm install)
              run: |
                  echo "@wadeck-app:registry=https:${GITHUB_NPM_REGISTRY_PATH}" >> ~/.npmrc
                  echo "${GITHUB_NPM_REGISTRY_PATH}:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dependencies
              run: npm install --prefer-offline

            - name: Build TypeScript
              run: npm run build

            - name: Build Go launchers
              run: npm run build-launcher

            - name: Compute version
              id: version
              run: bash ci/scripts/compute-version.sh
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  VERSION_INPUT: ${{ github.event.inputs.version }}
                  BREAKING_INPUT: ${{ github.event.inputs.breaking }}

            - name: Bundle
              run: npm run bundle
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash ci/scripts/generate-platform-packages.sh

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh

            - name: Set version in all packages
              run: |
                  for pkg in queue-cli-dist queue-cli-win32-x64 queue-cli-darwin-arm64 queue-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            - name: Configure GitHub npm registry (write -- for npm publish)
              run: |
                  echo "@wadeck-app:registry=https:${GITHUB_NPM_REGISTRY_PATH}" >> ~/.npmrc
                  echo "${GITHUB_NPM_REGISTRY_PATH}:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
                  echo "=== .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' ~/.npmrc
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish platform packages
              run: |
                  for pkg in queue-cli-win32-x64 queue-cli-darwin-arm64 queue-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ steps.version.outputs.dist_tag }})
                  done

            - name: Publish main package
              working-directory: packages/queue-cli-dist
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
