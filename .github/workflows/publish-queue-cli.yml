name: CI / Publish

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            - name: Run tests
              run: npm test

    publish:
        needs: build-and-test
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install dependencies
              run: npm install --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            - name: Build Go launchers
              run: npm run build-launcher

            - name: Compute version
              id: version
              run: bash ci/scripts/compute-version.sh
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  VERSION_INPUT: ${{ github.event.inputs.version }}
                  BREAKING_INPUT: ${{ github.event.inputs.breaking }}

            - name: Bundle
              run: npm run bundle
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash ci/scripts/generate-platform-packages.sh

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh

            - name: Set version in all packages
              run: |
                  for pkg in queue-cli-dist queue-cli-win32-x64 queue-cli-darwin-arm64 queue-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            - name: Publish platform packages
              run: |
                  for pkg in queue-cli-win32-x64 queue-cli-darwin-arm64 queue-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ steps.version.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package
              working-directory: packages/queue-cli-dist
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag as latest
              run: |
                  for pkg in queue-cli-win32-x64 queue-cli-darwin-arm64 queue-cli-darwin-x64 queue-cli-dist; do
                    PKG=$(node -e "process.stdout.write(require('./packages/${pkg}/package.json').name)")
                    ACTUAL_VER=$(npm view "${PKG}" dist-tags.edge --registry https://npm.pkg.github.com/ 2>/dev/null)
                    npm dist-tag add "${PKG}@${ACTUAL_VER}" latest --registry https://npm.pkg.github.com/
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
