# DataTable schema: rows + columns[{key,label,format?,mono?}]. format enum includes "datetime" (ts column).
# Pagination and PageSizeSelect `urlParam` need @wadeck-app/dsl-ui >= 2026.10.12-091-dd4b2887; older frontends render no pagination.
$sources:
  history:
    url: GET /api/modules/queue/history
    params:
      page: $urlParam.page
      limit: $urlParam.size

$type: PageContent
sections:
  - $type: DataTable
    rows: $sources.history.entries
    # Click a row's chevron to see the event payload. The toggle only shows when the row has a
    # payloadText (older entries recorded before payload capture have none), and one row is open
    # at a time. JsonViewer reads row[field] as JSON text, which is why the API sends payloadText;
    # `row` is NOT injected automatically, the expansion must pass it explicitly (`$ctx.row`).
    # Needs @wadeck-app/dsl-renderer >= 2026.10.14-094-eefae0af in the served frontend (it generates
    # the renderNode callback DataTable needs); older frontends show a toggle that opens nothing.
    expansionCondition: payloadText
    expansion:
      $type: JsonViewer
      row: $ctx.row
      field: payloadText
    emptyMessage: No events recorded yet
    columns:
      - { key: "ts", label: "Time", format: "datetime" }
      - { key: "event", label: "Event" }
      - { key: "eventId", label: "Event ID", mono: true }
      - { key: "project", label: "Project" }
      - { key: "matchedCount", label: "Matched" }
      - { key: "totalCount", label: "Total" }

  # HorizontalStack takes Tailwind classes; its DSL children key is `items` (see dsl-agent-fleet-app dashboard.yaml)
  - $type: HorizontalStack
    justify: justify-between
    align: items-center
    gap: gap-3
    items:
      - $type: Pagination
        urlParam: page
        total: $sources.history.total
        size: $sources.history.limit

      - $type: PageSizeSelect
        urlParam: size
        options: [20, 50, 100]
        value: $sources.history.limit
