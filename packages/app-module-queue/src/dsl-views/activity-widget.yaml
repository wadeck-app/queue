$sources:
  activity:
    url: GET /api/modules/queue/activity
  series:
    url: GET /api/modules/queue/activity/series

$type: VerticalStack
gap: gap-2
items:
  - $type: StatTile
    label: Events, last 5 min
    value: $sources.activity.last5Min
  - $type: StatTile
    label: Events, last 60 min
    value: $sources.activity.last60Min
  - $type: StatTile
    label: Events, last 24 h
    value: $sources.activity.last24Hours
  # variant and yFormat need dsl-ui >= 2026.10.19-117. An older shell draws full charts (hence 110 px: 80 squashes their axes), with
  # black bars when a series has no colour, and prints the hourly 1753 as "1.8 KB".
  - $type: Chart
    variant: sparkline
    data: $sources.series.lastHour
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 110
    series:
      - { key: events, name: "Events per 5 min", type: bar, yAxisId: left, color: "var(--color-primary)" }
  - $type: Chart
    variant: sparkline
    data: $sources.series.lastDay
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 110
    series:
      - { key: events, name: "Events per hour", type: area, yAxisId: left, color: "var(--color-primary)" }
