$sources:
  dlq:
    url: GET /api/modules/queue/dlq
    params:
      project: $urlParam.project
  projects:
    url: GET /api/modules/queue/projects
  daemon:
    url: GET /api/modules/queue/daemon

# {id} is the id of the clicked row (the renderer percent-encodes it).
$actions:
  replayEntry:
    url: POST /api/modules/queue/dlq/{id}/replay
    successMessage: Replay started
    errorPrefix: Could not replay
    reloadSources: true
  clearEntry:
    url: POST /api/modules/queue/dlq/{id}/clear
    confirm: Remove this entry from the dead-letter queue? It cannot be recovered.
    successMessage: Entry removed
    errorPrefix: Could not remove the entry
    reloadSources: true

$type: PageContent
sections:
  - $type: PageHeader
    title: Dead-letter queue
    subtitle: Dispatches that failed after all their retries.
  - $type: Badge
    $if: $sources.daemon.hint
    label: $sources.daemon.hint
    variant: warning
  - $type: CompactSelect
    $if: $sources.projects.options.length
    urlParam: project
    ariaLabel: Project
    placeholder: Any project
    options: $sources.projects.options
  - $type: DataTable
    rows: $sources.dlq.entries
    emptyMessage: No failed event
    columns:
      - { key: "movedAt", label: "Failed at", format: "datetime" }
      - { key: "event", label: "Event", href: "/modules/queue/history?event={event}" }
      - { key: "subscriberId", label: "Subscriber" }
      - { key: "attempts", label: "Attempts" }
      - { key: "lastError", label: "Last error" }
      - { key: "idShort", label: "Id", mono: true, nowrap: true, title: "{id}" }
      - type: actions
        items:
          - { label: Replay, action: replayEntry, icon: play, variant: primary }
          - { label: Clear, action: clearEntry, icon: trash, variant: danger-outline }
