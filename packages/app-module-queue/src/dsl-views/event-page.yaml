# One event type: what the program declared (description, schema, example) next to what really happened (24 h count, last push).
# Reached by link only (/events/<event name>), from the Events list, History, Subscribers and the Overview.
$sources:
  event:
    url: GET /api/modules/queue/events/detail
    params:
      name: $route.name

# The text of the example is edited in $vars.payload (seeded once from the declared example, never overwritten by a poll).
$vars:
  payload: $sources.event.exampleText

# {name} is filled from the route (/events/:name), percent-encoded. validatePayload keeps its answer in $validation and the text it validated in
# $validated: the push button is enabled only while the current text is the one that was validated, successfully. The push route validates again.
$actions:
  validatePayload:
    url: POST /api/modules/queue/events/{name}/validate-payload
    resultKey: validation
    requestKey: validated
    errorPrefix: Could not validate the payload
  pushTest:
    url: POST /api/modules/queue/events/{name}/push-test
    confirm: Push this event with its example payload? It runs the real subscribers of this event.
    successMessage: Test event pushed
    errorPrefix: Could not push the test event
    reloadSources: true

$type: PageContent
sections:
  # The source is a badge next to the title: it leads to every event that source declares.
  - $type: HorizontalStack
    gap: gap-3
    align: items-center
    items:
      - $type: PageHeader
        title: $sources.event.name
      - $type: Badge
        $if: $sources.event.sourceBadge
        label: $sources.event.sourceBadge
        href: $sources.event.sourceHref
        variant: info
  # An unknown name or no name: what is wrong and the closest declared names.
  - $type: Badge
    $if: $sources.event.message
    label: $sources.event.message
    variant: warning
  # The facts on one line of badges; the count leads to the dispatches of this event.
  - $type: HorizontalStack
    $if: $sources.event.found
    gap: gap-2
    align: items-center
    items:
      - $type: Badge
        label: $sources.event.status
        variant: info
      - $type: Badge
        $if: $sources.event.terminalText
        label: $sources.event.terminalText
        variant: default
      - $type: Badge
        label: $sources.event.countBadge
        href: $sources.event.historyHref
        variant: default
      - $type: Badge
        label: $sources.event.lastSeenBadge
        variant: default
      - $type: Badge
        $if: $sources.event.correlationBadge
        label: $sources.event.correlationBadge
        variant: default
  - $type: PageHeader
    $if: $sources.event.description
    title: Description
  - $type: Markdown
    $if: $sources.event.description
    text: $sources.event.description
  - $type: PageHeader
    $if: $sources.event.found
    title: Example payload
    subtitle: Edit it, validate it against the schema, then push it as a test event.
  - $type: FieldTextarea
    $if: $sources.event.hasExample
    label: Payload (JSON)
    bind: payload
    mono: true
    rows: 12
  # Validate first; the rocket stays disabled until the CURRENT text has been validated without a problem.
  - $type: HorizontalStack
    $if: $sources.event.hasExample
    gap: gap-3
    align: items-center
    items:
      - $type: ActionButton
        action: validatePayload
        label: Validate against the schema
        icon: check
        body:
          payload: $vars.payload
      - $type: ActionButton
        $if: $sources.event.canPushTest
        action: pushTest
        label: Push test event
        icon: rocket
        iconOnly: true
        variant: primary
        disabled: "!$validation.valid || $vars.payload != $validated.payload"
        disabledReason: Validate the current payload first
        body:
          payload: $vars.payload
      - $type: Badge
        $if: $validation.valid
        label: Valid
        variant: success
  - $type: Badge
    $if: $validation.errors.length
    label: $validation.verdict
    variant: warning
  - $type: DataTable
    $if: $validation.errors.length
    rows: $validation.errors
    columns:
      - { key: "path", label: "Where", mono: true }
      - { key: "message", label: "Problem" }
  - $type: Badge
    $if: $sources.event.exampleHint
    label: $sources.event.exampleHint
    variant: warning
  - $type: PageHeader
    $if: $sources.event.hasSchema
    title: Schema
    subtitle: JSON Schema of the payload, as declared.
  - $type: JsonViewer
    $if: $sources.event.hasSchema
    row: $sources.event
    field: schemaText
    maxHeight: 32rem
  - $type: PageHeader
    $if: $sources.event.filterable.length
    title: Filterable fields
    subtitle: The payload paths queue wait --when can test.
  - $type: DataTable
    $if: $sources.event.filterable.length
    rows: $sources.event.filterable
    columns:
      - { key: "path", label: "Path", mono: true }
      - { key: "type", label: "Type" }
      - { key: "requiredText", label: "Presence" }
  - $type: PageHeader
    $if: $sources.event.waitText
    title: Wait for it
    subtitle: Blocks until this event is pushed; adapt the filter.
  - $type: Markdown
    $if: $sources.event.waitText
    text: $sources.event.waitText
