# Needs a shell built with dsl-ui and dsl-renderer >= 2026.10.14-094 (urlParam pagination, row expansion); maxHeight needs >= 2026.10.17-095.
$sources:
  history:
    url: GET /api/modules/queue/history
    params:
      page: $urlParam.page
      limit: $urlParam.size
      event: $urlParam.event
      subscriberId: $urlParam.subscriber
      status: $urlParam.status
      project: $urlParam.project
  projects:
    url: GET /api/modules/queue/projects
  # The project the page is scoped to by ?project=, and the contributions of other modules to queue:project-header (an empty list when nobody contributes)
  projectScope:
    url: GET /api/modules/queue/project-scope
    params:
      project: $urlParam.project
  projectHeader:
    url: GET /api/slots/queue:project-header

# {eventId} is the event id of the clicked row (the renderer percent-encodes it). The replay runs the subscribers again.
$actions:
  replayEvent:
    url: POST /api/modules/queue/history/{eventId}/replay
    confirm: Replay this event? Its subscribers run again with the recorded payload.
    successMessage: Replay started
    errorPrefix: Could not replay
    reloadSources: true

$type: PageContent
sections:
  # Header of the project the page is filtered on: other modules add their link to it (slot queue:project-header). Hidden without a known project.
  - $type: ExtensionSlot
    $if: $sources.projectScope.found
    items: $sources.projectHeader
  # Same filters as `queue history --event / --subscriber / --status`; they need dsl-ui >= 2026.10.19-117 (urlParam on SearchBar and CompactSelect); resetUrlParams needs dsl-ui >= 2026.10.22-124 (a narrower filter or a new page size goes back to page 1)
  - $type: HorizontalStack
    gap: gap-3
    align: items-center
    items:
      - $type: SearchBar
        urlParam: event
        resetUrlParams: [page]
        placeholder: Event name
      - $type: SearchBar
        urlParam: subscriber
        resetUrlParams: [page]
        placeholder: Subscriber id
      - $type: CompactSelect
        urlParam: status
        resetUrlParams: [page]
        ariaLabel: Outcome
        placeholder: Any outcome
        options:
          - { value: success, label: Delivered }
          - { value: failed, label: Failed attempt }
          - { value: dlq, label: Given up (DLQ) }
          - { value: filtered, label: Filtered out }
      - $type: CompactSelect
        $if: $sources.projects.options.length
        urlParam: project
        resetUrlParams: [page]
        ariaLabel: Project
        placeholder: Any project
        options: $sources.projects.options
  - $type: DataTable
    rows: $sources.history.entries
    # `row` is not injected into the expansion: pass it with $ctx.row.
    expansionCondition: payloadText
    expansion:
      $type: JsonViewer
      row: $ctx.row
      field: payloadText
      # Webhook payloads run to thousands of lines: scroll inside the block.
      maxHeight: 20rem
    emptyMessage: No events on this page
    columns:
      - { key: "ts", label: "Time", format: "datetime" }
      - { key: "event", label: "Event", href: "/modules/queue/events/{event}" }
      - { key: "eventId", label: "Event ID", mono: true }
      - { key: "project", label: "Project" }
      - { key: "matchedCount", label: "Matched" }
      - { key: "totalCount", label: "Total" }
      - type: actions
        items:
          - { label: Replay, action: replayEvent, icon: play, variant: primary }

  - $type: HorizontalStack
    justify: justify-between
    align: items-center
    gap: gap-3
    items:
      - $type: Pagination
        urlParam: page
        total: $sources.history.total
        size: $sources.history.limit

      - $type: PageSizeSelect
        urlParam: size
        resetUrlParams: [page]
        options: [20, 50, 100]
        value: $sources.history.limit
