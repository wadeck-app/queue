# Needs a shell built with dsl-ui and dsl-renderer >= 2026.10.14-094 (urlParam pagination, row expansion); maxHeight needs >= 2026.10.17-095.
$sources:
  history:
    url: GET /api/modules/queue/history
    params:
      page: $urlParam.page
      limit: $urlParam.size

$type: PageContent
sections:
  - $type: DataTable
    rows: $sources.history.entries
    # `row` is not injected into the expansion: pass it with $ctx.row.
    expansionCondition: payloadText
    expansion:
      $type: JsonViewer
      row: $ctx.row
      field: payloadText
      # Webhook payloads run to thousands of lines: scroll inside the block.
      maxHeight: 20rem
    emptyMessage: No events on this page
    columns:
      - { key: "ts", label: "Time", format: "datetime" }
      - { key: "event", label: "Event" }
      - { key: "eventId", label: "Event ID", mono: true }
      - { key: "project", label: "Project" }
      - { key: "matchedCount", label: "Matched" }
      - { key: "totalCount", label: "Total" }

  - $type: HorizontalStack
    justify: justify-between
    align: items-center
    gap: gap-3
    items:
      - $type: Pagination
        urlParam: page
        total: $sources.history.total
        size: $sources.history.limit

      - $type: PageSizeSelect
        urlParam: size
        options: [20, 50, 100]
        value: $sources.history.limit
