$sources:
  outcomes:
    url: GET /api/modules/queue/outcomes

# Chosen among the A/B variants of 5b6f846: one row of three tiles under a caption that says the period. variant and yFormat need
# dsl-ui >= 2026.10.19-117.
# The tiles share the full width in equal columns; the chart takes what height is left in the dashboard tile.
$type: VerticalStack
gap: gap-2
fill: true
items:
  - $type: Badge
    label: Last 24 hours
    tone: subtle
    size: sm
  - $type: HorizontalStack
    gap: gap-2
    itemSizes: [flex, flex, flex]
    items:
      - $type: StatTile
        label: Delivered
        value: $sources.outcomes.last24Hours.delivered
        href: "/modules/queue/history?status=success"
      - $type: StatTile
        label: Failed
        value: $sources.outcomes.last24Hours.failedAttempts
        href: "/modules/queue/history?status=failed"
      - $type: StatTile
        label: Given up
        value: $sources.outcomes.last24Hours.givenUp
        href: "/modules/queue/dlq"
  - $type: Chart
    $if: $sources.outcomes.hasFailures
    variant: sparkline
    fill: true
    data: $sources.outcomes.series
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 110
    series:
      - { key: failedAttempts, name: "Failed attempts per hour", type: bar, yAxisId: left, color: "var(--color-warning)" }
      - { key: givenUp, name: "Given up per hour", type: bar, yAxisId: left, color: "var(--color-danger)" }
