$sources:
  overview:
    url: GET /api/modules/queue/overview
    params:
      range: $urlParam.range

$type: PageContent
sections:
  - $type: HorizontalStack
    gap: gap-3
    align: items-center
    justify: justify-between
    items:
      - $type: PageHeader
        title: Overview
        subtitle: What the queue did lately, from its history and dispatch log.
      # The period drives every figure and chart below; the URL keeps it (?range=6h), so a link or a bookmark keeps the period.
      - $type: CompactSelect
        urlParam: range
        ariaLabel: Period
        placeholder: Last 24 hours
        options:
          - { value: 1h, label: Last hour }
          - { value: 6h, label: Last 6 hours }
          - { value: 24h, label: Last 24 hours }
          - { value: 3d, label: Last 3 days }
          - { value: 7d, label: Last 7 days }
  - $type: HorizontalStack
    gap: gap-3
    items:
      - $type: StatTile
        label: Events pushed
        value: $sources.overview.totals.events
        href: "/modules/queue/history"
      - $type: StatTile
        label: Delivered
        value: $sources.overview.totals.delivered
        href: "/modules/queue/history?status=success"
      - $type: StatTile
        label: Failed attempts
        value: $sources.overview.totals.failedAttempts
        href: "/modules/queue/history?status=failed"
      - $type: StatTile
        label: Given up (DLQ)
        value: $sources.overview.totals.givenUp
        href: "/modules/queue/dlq"
  - $type: PageHeader
    title: Events pushed
    subtitle: Per slice of the period; the last bar is the current, partial one.
  - $type: Chart
    data: $sources.overview.events
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 240
    series:
      - { key: events, name: "Events", type: bar, yAxisId: left, color: "var(--color-primary)" }
  - $type: PageHeader
    $if: $sources.overview.hasFailures
    title: Failures
    subtitle: A failed attempt is retried; a dispatch given up sits in the DLQ.
  - $type: Chart
    $if: $sources.overview.hasFailures
    data: $sources.overview.failures
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 240
    series:
      - { key: failedAttempts, name: "Failed attempts", type: bar, yAxisId: left, color: "var(--color-warning)" }
      - { key: givenUp, name: "Given up", type: bar, yAxisId: left, color: "var(--color-danger)" }
  - $type: PageHeader
    title: Most pushed events
  - $type: DataTable
    rows: $sources.overview.topEvents
    emptyMessage: No event in this period
    columns:
      - { key: "event", label: "Event", href: "/modules/queue/history?event={event}" }
      - { key: "count", label: "Pushed" }
  - $type: PageHeader
    title: Subscribers
    subtitle: Busiest first. Durations come from the dispatch log.
  - $type: DataTable
    rows: $sources.overview.subscribers
    emptyMessage: No dispatch in this period
    columns:
      - { key: "subscriberId", label: "Subscriber", mono: true, href: "/modules/queue/history?subscriber={subscriberId}" }
      - { key: "delivered", label: "Delivered" }
      - { key: "failedAttempts", label: "Failed attempts" }
      - { key: "givenUp", label: "Given up (DLQ)" }
      - { key: "avgMs", label: "Average (ms)" }
      - { key: "maxMs", label: "Slowest (ms)" }
