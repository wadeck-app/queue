$sources:
  activity:
    url: GET /api/modules/queue/activity
  series:
    url: GET /api/modules/queue/activity/series
  outcomes:
    url: GET /api/modules/queue/outcomes
  breakdown:
    url: GET /api/modules/queue/breakdown

$type: PageContent
sections:
  - $type: PageHeader
    title: Overview
    subtitle: What the queue did lately, from its history and dispatch log.
  - $type: HorizontalStack
    gap: gap-3
    items:
      - $type: StatTile
        label: Events, last 5 min
        value: $sources.activity.last5Min
      - $type: StatTile
        label: Events, last 60 min
        value: $sources.activity.last60Min
      - $type: StatTile
        label: Events, last 24 h
        value: $sources.activity.last24Hours
      - $type: StatTile
        label: Delivered, last 24 h
        value: $sources.outcomes.last24Hours.delivered
      - $type: StatTile
        label: Failed attempts, last 24 h
        value: $sources.outcomes.last24Hours.failedAttempts
      - $type: StatTile
        label: Given up (DLQ), last 24 h
        value: $sources.outcomes.last24Hours.givenUp
  - $type: PageHeader
    title: Events pushed, last hour
    subtitle: Per 5 minutes; the last bar is the current, partial one.
  - $type: Chart
    data: $sources.series.lastHour
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 240
    series:
      - { key: events, name: "Events per 5 min", type: bar, yAxisId: left, color: "var(--color-primary)" }
  - $type: PageHeader
    $if: $sources.outcomes.hasFailures
    title: Failures, last 24 hours
    subtitle: Per hour. A failed attempt is retried; a dispatch given up sits in the DLQ.
  - $type: Chart
    $if: $sources.outcomes.hasFailures
    data: $sources.outcomes.series
    xAxisKey: label
    xAxisType: category
    yFormat: number
    height: 240
    series:
      - { key: failedAttempts, name: "Failed attempts per hour", type: bar, yAxisId: left, color: "var(--color-warning)" }
      - { key: givenUp, name: "Given up per hour", type: bar, yAxisId: left, color: "var(--color-danger)" }
  - $type: PageHeader
    title: Most pushed events, last 24 hours
  - $type: DataTable
    rows: $sources.breakdown.topEvents
    emptyMessage: No event in the last 24 h
    columns:
      - { key: "event", label: "Event" }
      - { key: "count", label: "Pushed" }
  - $type: PageHeader
    title: Subscribers, last 24 hours
    subtitle: Busiest first. Durations come from the dispatch log.
  - $type: DataTable
    rows: $sources.breakdown.subscribers
    emptyMessage: No dispatch in the last 24 h
    columns:
      - { key: "subscriberId", label: "Subscriber", mono: true }
      - { key: "delivered", label: "Delivered" }
      - { key: "failedAttempts", label: "Failed attempts" }
      - { key: "givenUp", label: "Given up (DLQ)" }
      - { key: "avgMs", label: "Average (ms)" }
      - { key: "maxMs", label: "Slowest (ms)" }
