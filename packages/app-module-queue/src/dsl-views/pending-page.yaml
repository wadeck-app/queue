$sources:
  pending:
    url: GET /api/modules/queue/pending
  daemon:
    url: GET /api/modules/queue/daemon

# {id} is the id of the clicked row (the renderer percent-encodes it): the retry runs that subscriber now.
$actions:
  retryPending:
    url: POST /api/modules/queue/retry/{id}
    successMessage: Retry enqueued
    errorPrefix: Could not retry
    reloadSources: true
  # Every event that waited so long that nobody retries it any more (see STUCK_AFTER_MS in queue-core) moves to the dead-letter queue.
  giveUpStuck:
    url: POST /api/modules/queue/pending/give-up-stuck
    confirm: Give up every stuck event? They move to the dead-letter queue and are no longer retried; you can replay or clear them there.
    successMessage: Stuck events moved to the dead-letter queue
    errorPrefix: Could not give up the stuck events
    reloadSources: true
  # For an event nobody retries any more (its retry job was never scheduled or was lost): it moves to the dead-letter queue, nothing is deleted.
  giveUpPending:
    url: POST /api/modules/queue/pending/{id}/give-up
    confirm: Give up this event? It moves to the dead-letter queue and is no longer retried; you can replay or clear it there.
    successMessage: Moved to the dead-letter queue
    errorPrefix: Could not give up
    reloadSources: true

$type: PageContent
sections:
  - $type: PageHeader
    title: Pending events
    subtitle: Written to the WAL and not delivered yet. The daemon retries them by itself; retrying one here runs its subscriber now.
  # What needs attention, in a box of its own: the sentence on the left, its action on the right.
  - $type: Card
    $if: $sources.daemon.hint
    padding: sm
    items:
      - $type: Markdown
        text: $sources.daemon.hint
  - $type: Card
    $if: $sources.pending.stuckCount
    padding: sm
    items:
      - $type: HorizontalStack
        gap: gap-4
        justify: justify-between
        align: items-center
        items:
          - $type: Markdown
            text: $sources.pending.stuckText
          - $type: ActionButton
            action: giveUpStuck
            label: Give up all the stuck events
            icon: archive
            variant: danger-outline
  - $type: DataTable
    rows: $sources.pending.entries
    emptyMessage: Nothing is waiting
    columns:
      - { key: "queuedAt", label: "Queued at", format: "datetime" }
      - { key: "event", label: "Event", nowrap: true, href: "/modules/queue/history?event={event}" }
      - { key: "subscriberId", label: "Subscriber", nowrap: true }
      - { key: "status", label: "Status" }
      - { key: "attempts", label: "Attempts" }
      - { key: "lastError", label: "Last error", nowrap: true }
      - { key: "idShort", label: "Id", mono: true, nowrap: true, title: "{id}" }
      - type: actions
        items:
          - { label: Retry now, action: retryPending, icon: rotate-ccw, variant: primary }
          - { label: Give up, action: giveUpPending, icon: archive, variant: danger-outline }
