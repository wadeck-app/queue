$sources:
  status:
    url: GET /api/modules/queue/status
  pending:
    url: GET /api/modules/queue/pending

# Each tile leads to the page where its events can be dealt with (drill-down). One row of three small tiles (a dashboard cell is about 270 px wide: more than three would wrap their labels). Chosen among
# the A/B variants of 5b6f846. "Retry" counts the events that failed an attempt and wait for a retry (Queue Pending page); the
# pending counter alone hides them.
# The three tiles share the full width in equal columns and take the height of the tile (fill; the dashboard tile needs a definite height: the manifest gives one).
$type: HorizontalStack
gap: gap-2
fill: true
align: items-stretch
itemSizes: [flex, flex, flex]
items:
  - $type: StatTile
    label: Pending
    fill: true
    value: $sources.status.pendingCount
    href: "/modules/queue/pending"
  - $type: StatTile
    label: Retry
    fill: true
    value: $sources.pending.awaitingRetry
    href: "/modules/queue/pending"
  - $type: StatTile
    label: DLQ
    fill: true
    value: $sources.status.dlqCount
    href: "/modules/queue/dlq"
