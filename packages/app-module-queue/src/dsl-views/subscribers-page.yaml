$sources:
  subscribers:
    url: GET /api/modules/queue/subscribers
    params:
      cwd: $urlParam.cwd

$type: PageContent
sections:
  - $type: PageHeader
    title: Subscribers
    subtitle: From the global subscribers.yml and the project of the working directory (?cwd=). Edit them with queue sub.
  - $type: DataTable
    rows: $sources.subscribers.subscribers
    emptyMessage: No subscriber configured
    columns:
      - { key: "event", label: "Event" }
      - { key: "subscriberId", label: "Id", mono: true }
      - { key: "type", label: "Type" }
      - { key: "command", label: "Command", mono: true }
      - { key: "url", label: "URL", mono: true }
      - { key: "when", label: "When", mono: true }
      - { key: "retries", label: "Retries" }
