$sources:
  subscribers:
    url: GET /api/modules/queue/subscribers
    params:
      cwd: $urlParam.cwd
  breakdown:
    url: GET /api/modules/queue/breakdown

$type: PageContent
sections:
  - $type: PageHeader
    title: Subscribers
    subtitle: From the global subscribers.yml and the project of the working directory (?cwd=). Edit them with queue sub.
  - $type: DataTable
    rows: $sources.subscribers.subscribers
    emptyMessage: No subscriber configured
    columns:
      - { key: "event", label: "Event", nowrap: true, href: "/modules/queue/events/{event}" }
      - { key: "name", label: "Name", nowrap: true }
      - { key: "subscriberId", label: "Id", mono: true, nowrap: true }
      - { key: "type", label: "Type" }
      - { key: "action", label: "Action", mono: true }
      - { key: "command", label: "Command", mono: true }
      - { key: "url", label: "URL", mono: true }
      - { key: "when", label: "When", mono: true }
      - { key: "retries", label: "Retries" }
  - $type: PageHeader
    title: Last 24 hours
    subtitle: How the dispatches of each subscriber ended, busiest first. Durations come from the dispatch log.
  - $type: DataTable
    rows: $sources.breakdown.subscribers
    emptyMessage: No dispatch in the last 24 h
    columns:
      - { key: "subscriberId", label: "Subscriber", mono: true }
      - { key: "delivered", label: "Delivered" }
      - { key: "failedAttempts", label: "Failed attempts" }
      - { key: "givenUp", label: "Given up (DLQ)" }
      - { key: "avgMs", label: "Average (ms)" }
      - { key: "maxMs", label: "Slowest (ms)" }
